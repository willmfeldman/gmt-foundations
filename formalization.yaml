# Theorem manifest for GMTFoundations, modeled on the theorem-manifest conventions used by public
# Lean formalization repositories. CI (scripts/check-formalization-manifest.rb) checks that every
# listed Lean name resolves, that each target depends on exactly axioms.expected, and that the
# challenge inventory below matches challenges/*/config.json; CI also elaborates the external
# challenge workspaces. Statement equality between challenges and solutions is checked only by
# the release comparator workflow.
schema_version: "1"
project:
  name: "GMTFoundations"
  title: "GMT Foundations: sets of finite perimeter, Reifenberg theorems, and Sobolev compactness in Lean"
  authors:
    - "William M. Feldman"
  repository: "https://github.com/willmfeldman/gmt-foundations"
  license: "Apache-2.0"
  language: "Lean"
  theorem_prover: "Lean 4"
  lean_toolchain: "leanprover/lean4:v4.34.1"
  mathlib: "v4.34.1"

build:
  package_file: "lakefile.toml"
  manifest_file: "lake-manifest.json"
  root_import: "GMTFoundations"
  comparator_target: "GMTFoundationsComparator"
  commands:
    - "lake exe cache get"
    - "lake build"

axioms:
  expected:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"

automation:
  methods:
    - method: "agent-assisted formalization"
      models:
        - "Claude (Anthropic)"
      framework: "Claude Code agentic coding workflow"
      review_status: "human-supervised"
      notes: >-
        The Lean proofs were written by AI coding agents (Claude) under the author's mathematical
        direction and review. The theorem statements and proof routes were reviewed by the author.
        Correctness rests on Lean's kernel check, together with the comparator challenges in
        challenges/.

# The nine headline theorems. Each is stated in the library as `theorem foo : FooStatement n`,
# where `statement_interface` is a named Prop in GMTFoundations/Statements/.
targets:
  - id: "rellich-trace"
    title: "Rellich–Kondrachov compactness with compact boundary trace on the unit ball"
    kind: "headline-theorem"
    lean_name: "GMTFoundations.rellich_trace_weak_compactness"
    lean_file: "GMTFoundations/Sobolev/RellichTrace.lean"
    statement_interface: "GMTFoundations.RellichTraceStatement"
    challenge: "challenges/rellich-trace"
    challenge_theorem: "challenge_rellich_trace"
    source: >-
      L. C. Evans and R. F. Gariepy, Measure Theory and Fine Properties of Functions, revised
      edition, CRC Press, 2015: Theorem 4.11 (compactness) and Theorem 4.6 (traces).
    statement: >-
      Let n ≥ 1 and let f_k be Lipschitz on the closed unit ball of ℝⁿ with
      ∫_{B₁} (f_k² + |∇f_k|²) ≤ C for all k. Then along a subsequence f_k converges in L²(B₁)
      to some F, the boundary values f_k|_{∂B₁} converge in L²(∂B₁) (surface measure), and ∇f_k
      converges weakly in L²(B₁; ℝⁿ) to a field G that is the weak gradient of F in B₁.

  - id: "discrete-reifenberg"
    title: "Discrete Reifenberg theorem for hyperplanes"
    kind: "headline-theorem"
    lean_name: "GMTFoundations.discrete_reifenberg"
    lean_file: "GMTFoundations/Reifenberg/Discrete.lean"
    statement_interface: "GMTFoundations.DiscreteReifenbergStatement"
    challenge: "challenges/reifenberg"
    challenge_theorem: "challenge_discrete_reifenberg"
    source: >-
      A. Naber and D. Valtorta, Rectifiable-Reifenberg and the regularity of stationary and
      minimizing harmonic maps, Ann. of Math. (2) 185 (2017), 131–227 (arXiv:1504.02043),
      Theorem 3.4 with Remark 3.2. The proof follows M. Miśkiewicz, Discrete Reifenberg-type
      theorem, Ann. Acad. Sci. Fenn. Math. 43 (2018) (arXiv:1612.02461), Theorem 1.1 with q = 2.
    statement: >-
      Codimension one (k = n − 1, n ≥ 2), with the mass threshold ε_n of Naber–Valtorta
      Definition 3.1 set to 0. There are δ > 0 and D such that for every finite collection of
      disjoint balls B_{r_j}(x_j) ⊆ B₂ with associated measure μ = Σ_j ω_{n-1} r_j^{n-1} δ_{x_j},
      if ∫_{B_s(y)} ∫_0^s β²_μ(z, t) dt/t dμ(z) < δ² s^{n-1} for every ball B_s(y) ⊆ B₂, then
      Σ_{x_j ∈ B₁} r_j^{n-1} < D. Here β²_μ is the squared L² Jones number with respect to
      affine hyperplanes.

  - id: "rectifiable-reifenberg"
    title: "Rectifiable-Reifenberg theorem for hyperplanes (rectifiability)"
    kind: "headline-theorem"
    lean_name: "GMTFoundations.rectifiable_reifenberg"
    lean_file: "GMTFoundations/Reifenberg/Rectifiable.lean"
    statement_interface: "GMTFoundations.RectifiableReifenbergStatement"
    challenge: "challenges/reifenberg"
    challenge_theorem: "challenge_rectifiable_reifenberg"
    source: >-
      Naber–Valtorta (Ann. of Math. 185, 2017), Theorem 3.3 (2) with Remark 3.2, in codimension
      one and under an additional upper density hypothesis.
    statement: >-
      For n ≥ 2 and every C there is δ > 0 such that: if S ⊆ B₂ ⊆ ℝⁿ is Borel with
      ℋ^{n-1}(S) < ∞ and ℋ^{n-1}(S ∩ B_r(x)) ≤ C r^{n-1} for every ball, and
      ∫_{S ∩ B_s(y)} ∫_0^s β²_{ℋ^{n-1}⌊S}(z, t) dt/t dℋ^{n-1}(z) < δ² s^{n-1} for every ball
      B_s(y) ⊆ B₂, then S ∩ B₁ is countably ℋ^{n-1}-rectifiable. This is the rectifiability
      conclusion of Naber–Valtorta Theorem 3.3 only (not the measure bound), and δ depends on C.

  - id: "gauss-green-pair"
    title: "Gauss–Green measure from a divergence bound"
    kind: "headline-theorem"
    lean_name: "GMTFoundations.exists_isGaussGreenPair_of_integral_divergence_le"
    lean_file: "GMTFoundations/Perimeter/GaussGreenPair/Basic.lean"
    statement_interface: "GMTFoundations.GaussGreenPairOfDivergenceBoundStatement"
    challenge: "challenges/perimeter-structure"
    challenge_theorem: "challenge_gauss_green_pair_of_divergence_bound"
    source: >-
      Evans–Gariepy (revised edition, 2015), Theorem 5.1 (structure theorem for BV_loc
      functions), applied to χ_E.
    statement: >-
      For n ≥ 2, U ⊆ ℝⁿ open and E measurable: if |∫_E div φ| ≤ C sup|φ| for every
      φ ∈ C^∞_c(U; ℝⁿ), then there are a Radon measure μ on U with μ(U) ≤ C and a μ-a.e. unit
      vector field ν such that ∫_E div φ = ∫ φ · ν dμ for every φ ∈ C^∞_c(U; ℝⁿ)
      (a Gauss–Green pair).

  - id: "local-perimeter"
    title: "Gauss–Green pair for sets of locally finite perimeter"
    kind: "headline-theorem"
    lean_name: "GMTFoundations.hasLocallyFinitePerimeter_of_local"
    lean_file: "GMTFoundations/Perimeter/Local.lean"
    statement_interface: "GMTFoundations.LocallyFinitePerimeterOfLocalStatement"
    challenge: "challenges/perimeter-structure"
    challenge_theorem: "challenge_gauss_green_pair_of_locally_finite_perimeter"
    source: >-
      Evans–Gariepy (revised edition, 2015), Theorem 5.1, for χ_E ∈ BV_loc(U).
    statement: >-
      For n ≥ 2, U ⊆ ℝⁿ open and E measurable: if every point of U has a ball B_r(x) ⊆ U and a
      constant C with |∫_E div φ| ≤ C sup|φ| for all φ ∈ C^∞_c(B_r(x); ℝⁿ), then E has a
      Gauss–Green pair on all of U.

  - id: "blow-up"
    title: "De Giorgi's blow-up theorem at reduced-boundary points"
    kind: "headline-theorem"
    lean_name: "GMTFoundations.hasDensity_symmDiff_halfSpace"
    lean_file: "GMTFoundations/Perimeter/BlowUp.lean"
    statement_interface: "GMTFoundations.HalfSpaceBlowUpStatement"
    challenge: "challenges/perimeter-structure"
    challenge_theorem: "challenge_half_space_blow_up"
    source: >-
      Evans–Gariepy (revised edition, 2015), Theorem 5.13 (blow-up of the reduced boundary).
    statement: >-
      For n ≥ 2, let (μ, ν) be a Gauss–Green pair for a measurable set E in an open set Ω, and
      let x ∈ Ω be a reduced-boundary point: μ(B_r(x)) > 0 for all r > 0 and the averages of ν
      over B_r(x) with respect to μ converge to a unit vector v as r → 0. Then the symmetric
      difference of E and the half-space {y : ⟪y − x, v⟫ < 0} has Lebesgue density 0 at x.

  - id: "rectifiable-boundary"
    title: "Rectifiability of the essential boundary"
    kind: "headline-theorem"
    lean_name: "GMTFoundations.HasLocallyFinitePerimeter.rectifiable_essentialBoundary"
    lean_file: "GMTFoundations/Perimeter/Structure.lean"
    statement_interface: "GMTFoundations.RectifiableEssentialBoundaryStatement"
    challenge: "challenges/perimeter-structure"
    challenge_theorem: "challenge_rectifiable_essential_boundary"
    source: >-
      Evans–Gariepy (revised edition, 2015), Theorem 5.15 (i) and Lemma 5.5.
    statement: >-
      For n ≥ 2, if a measurable set E has locally finite perimeter in an open set Ω (in the
      library: E has a Gauss–Green pair in Ω), then the essential boundary ∂_*E ∩ Ω is
      countably ℋ^{n-1}-rectifiable, it differs from the reduced boundary ∂*E ∩ Ω by an
      ℋ^{n-1}-null set, and ∂*E ∩ Ω ⊆ ∂_*E.

  - id: "perimeter-measure"
    title: "The perimeter measure is ℋ^{n-1} restricted to the essential boundary"
    kind: "headline-theorem"
    lean_name: "GMTFoundations.IsGaussGreenPair.eq_hausdorffN_restrict"
    lean_file: "GMTFoundations/Perimeter/Structure.lean"
    statement_interface: "GMTFoundations.GaussGreenMeasureEqHausdorffStatement"
    challenge: "challenges/perimeter-structure"
    challenge_theorem: "challenge_perimeter_measure_eq_hausdorff"
    source: >-
      Evans–Gariepy (revised edition, 2015), Theorem 5.15 (iii) with Lemma 5.5.
    statement: >-
      For n ≥ 2, if (μ, ν) is a Gauss–Green pair for a measurable set E in an open set Ω, then
      μ = ℋ^{n-1}⌊(Ω ∩ ∂_*E), where ℋ^{n-1} is the normalized Hausdorff measure and ∂_*E the
      essential (measure-theoretic) boundary.

  - id: "federer-null"
    title: "Federer's criterion, null case"
    kind: "headline-theorem"
    lean_name: "GMTFoundations.ae_trivial_of_hausdorffN_essentialBoundary_inter_ball"
    lean_file: "GMTFoundations/Perimeter/Criterion.lean"
    statement_interface: "GMTFoundations.TrivialOfNullEssentialBoundaryStatement"
    challenge: "challenges/perimeter-structure"
    challenge_theorem: "challenge_trivial_of_null_essential_boundary"
    source: >-
      Evans–Gariepy (revised edition, 2015), Theorem 5.23 (criterion for finite perimeter),
      localized to a ball, with the relative isoperimetric inequality (Theorem 5.11 (ii)).
    statement: >-
      For n ≥ 2, if E ⊆ ℝⁿ is measurable and ℋ^{n-1}(∂_*E ∩ B_r(c)) = 0, then E ∩ B_r(c) or
      B_r(c) \ E is Lebesgue-null.

comparator:
  smoke_test:
    lean_file: "GMTFoundations/Comparator.lean"
    lake_target: "GMTFoundationsComparator"
    purpose: >-
      API-regression smoke tests: the root import exposes the nine headline theorems, each
      discharging its named statement interface. It imports the library, so it certifies
      nothing on its own and is not a substitute for the external comparator challenges.
  external_challenges:
    directory: "challenges"
    purpose: >-
      Standalone comparator challenge workspaces. In each, Statement.lean imports Mathlib only
      and defines the trusted claims; Challenge.lean states them with `sorry`; Solution.lean
      imports GMTFoundations and proves the same statements.
    release_workflow: ".github/workflows/release-comparator.yml"
    comparator_revision: "575674928e239f5bc452aab72d1dd7b0f1326494"
    lean4export_revision: "076e8e57707e813375e8f9da8bf989799ace9680"
    landrun_revision: "811cfff51ceaf3d9843708aa6d22e9b84ccac8b4"
    toolchain: "leanprover/lean4:v4.34.1"
    mathlib: "v4.34.1"
    permitted_axioms:
      - "propext"
      - "Classical.choice"
      - "Quot.sound"
    entries:
      - id: "rellich-trace"
        classification: "release-theorem-comparator"
        path: "challenges/rellich-trace"
        theorem_names:
          - "challenge_rellich_trace"
        checks: >-
          Rellich–Kondrachov compactness with compact trace, stated with Mathlib's gradient,
          MemLp, Bochner integrals and the surface measure Measure.toSphere.
      - id: "reifenberg"
        classification: "release-theorem-comparator"
        path: "challenges/reifenberg"
        theorem_names:
          - "challenge_discrete_reifenberg"
          - "challenge_rectifiable_reifenberg"
        checks: >-
          The discrete and rectifiable Reifenberg theorems for hyperplanes, with the Jones
          numbers, the normalized Hausdorff measure and countable rectifiability defined inline
          from Mathlib.
      - id: "perimeter-structure"
        classification: "release-theorem-comparator"
        path: "challenges/perimeter-structure"
        theorem_names:
          - "challenge_gauss_green_pair_of_divergence_bound"
          - "challenge_gauss_green_pair_of_locally_finite_perimeter"
          - "challenge_half_space_blow_up"
          - "challenge_rectifiable_essential_boundary"
          - "challenge_perimeter_measure_eq_hausdorff"
          - "challenge_trivial_of_null_essential_boundary"
        checks: >-
          The six structure theorems for sets of locally finite perimeter, with Gauss–Green
          pairs, reduced and essential boundaries, densities and rectifiability defined inline
          from Mathlib. Locally finite perimeter is the distributional bound (implied by the
          BV_loc definition of Evans–Gariepy), not the existence of a Gauss–Green pair, so the
          rectifiability challenge also exercises the structure theorem.

ci:
  workflow: ".github/workflows/ci.yml"
  expected_check: >-
    lake build with warnings as errors, API smoke-test target, formalization.yaml validation,
    Lean-name resolution, exact axiom check on the nine targets, proof-integrity scan, and
    elaboration of every challenge workspace's Statement, Challenge and Solution sources.
  release_workflow: ".github/workflows/release-comparator.yml"
  release_check: >-
    Comparator execution over every challenges/*/config.json with pinned tool revisions,
    uploading an attestation artifact; required before any tag or GitHub release.
